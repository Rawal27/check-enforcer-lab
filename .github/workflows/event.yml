name: Check Enforcer Test

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  event-handler:
    permissions:
      statuses: write
      pull-requests: write
      checks: read

    runs-on: ubuntu-latest

    steps:
      - uses: azure/azure-sdk-actions@6a2d61414e790705ab24370421c0a5b04b65de53
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
